name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/openjarvis/**"
      - "frontend/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/openjarvis/**"
      - "frontend/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install documentation dependencies
        run: uv sync --extra docs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build full web application
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Inject leaderboard Supabase anon key
        env:
          OPENJARVIS_LEADERBOARD_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          key = os.environ.get("OPENJARVIS_LEADERBOARD_ANON", "")
          pathlib.Path("docs/javascripts/leaderboard-config.js").write_text(
              "// Generated at docs-build time from the VITE_SUPABASE_ANON_KEY secret.\n"
              "window.OPENJARVIS_SUPABASE_ANON_KEY = " + json.dumps(key) + ";\n",
              encoding="utf-8",
          )
          print("leaderboard anon key:", "set" if key else "empty (leaderboard disabled)")
          PY

      - name: Build documentation
        run: uv run mkdocs build

      - name: Add full web application to Pages artifact
        run: |
          mkdir -p site/app
          cp -R src/openjarvis/server/static/. site/app/

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
